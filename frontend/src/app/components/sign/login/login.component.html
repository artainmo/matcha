<section class="auth-page">
    <form class="auth-card panel">
        <h2>Welcome back</h2>
        <mat-form-field appearance="fill">
            <mat-label>Enter your user</mat-label>
            <input [(ngModel)]="user" autocomplete="on" matInput name="username">
            @if (badLogin$ | async) {
                <mat-error>{{ message$ | async }}</mat-error>
            }
        </mat-form-field>
        <mat-form-field appearance="fill">
            <mat-label>Enter your password</mat-label>
            <input [(ngModel)]="password" [type]="hide ? 'password' : 'text'" autocomplete="on" matInput name="password">
            @if (wrongPassword$ | async) {
                <mat-error>{{ message$ | async }}</mat-error>
            }
            <button (click)="hide = !hide" [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hide" mat-icon-button
                    matSuffix type="button">
                <mat-icon>{{ hide ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
        </mat-form-field>
        @if ((badLogin$ | async) || (wrongPassword$ | async)) {
            <p class="auth-error">{{ message$ | async }}</p>
        }
        <div class="auth-actions">
            <button (click)="login()" [disabled]="!user || !password" color="primary" mat-raised-button type="button">Login
            </button>
            <button mat-button routerLink="/profile/password/request" type="button">Reset password</button>
        </div>
    </form>
</section>
